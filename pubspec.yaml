name: playx_network
description: playx_network is a Wrapper around Dio that can perform api request with better error handling and easily get the result of any api request.
version: 1.1.0
homepage: https://sourcya.io
repository: https://github.com/playx-flutter/playx_network
issue_tracker: https://github.com/playx-flutter/playx_network/issues

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

topics:
    - playx
    - dio
    - network
    - api

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  sentry_dio: '>=9.16.0 <11.0.0'
  talker: '>=5.1.16 <6.0.0'
  talker_dio_logger: '>=5.1.16 <6.0.0'
  playx_core: ^2.0.0
  dio_smart_retry: ^7.0.1
  dio_web_adapter: '>=2.1.2 <3.0.0'
  web: '>=1.0.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

